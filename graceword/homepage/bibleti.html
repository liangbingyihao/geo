
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Bible TI</title>
  <meta name="description" content="20題，3分鐘，發現你最像哪位聖經人物。" />
  <meta property="og:title" content="BibleTI — 你最像哪位聖經人物？" />
  <meta property="og:description" content="20題，發現你最像哪位聖經人物。" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Serif+TC:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-7CEHJHLWK1"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-7CEHJHLWK1');
    </script>
  <style>
    /* ─── Reset & Base ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    :root {
      --bg:        #FDF9F7;
      --card:      #FFFFFF;
      --primary:   #8C1A1A;
      --gold:      #8B1B1B;
      --gold-lt:   #FDF9F7;
      --text:      #2A1A0E;
      --text-2:    #333333;
      --border:    #E6D9C8;
      --shadow:    0 4px 24px rgba(44,24,8,.08);
      --radius:    16px;
      --radius-sm: 10px;
      --font-body: 'Lora', 'Noto Serif TC', 'Noto Serif SC', 'Songti TC', 'Songti SC', serif;
    }
    :root:lang(zh-Hans) {
      --font-body: 'Lora', 'Noto Serif SC', 'Noto Serif TC', 'Songti SC', 'Songti TC', serif;
    }
    :root:lang(en) {
      --font-body: 'Lora', serif;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ─── Layout ─── */
    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100dvh;
    }

    .screen {
      width: 100%;
      max-width: 520px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 0 20px 40px;
    }

    /* ─── Language Bar ─── */
    .lang-bar {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      padding: 16px 0 0;
    }

    .lang-btn {
      font-family: var(--font-body);
      font-size: 14px;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--text-2);
      cursor: pointer;
      transition: all .2s;
    }
    .lang-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .lang-btn:hover:not(.active) {
      border-color: var(--gold);
      color: var(--gold);
    }

    /* ─── Landing Screen ─── */
    .landing-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0;
      padding-top: 0;
    }

    .landing-title {
      font-size: clamp(22px, 6vw, 28px);
      font-weight: 700;
      color: var(--primary);
      line-height: 1.4;
      letter-spacing: .02em;
      text-align: center;
      margin-top: 32px;
    }

    /* Character Preview Carousel */
    .char-preview {
      border-radius: var(--radius);
      padding: 20px 20px 10px 20px;
      margin: 16px 0 24px;
      box-shadow: 0px 5px 10px 1px rgba(229,76,63,0.12);
      position: relative;
      overflow: hidden;
      aspect-ratio: 1065 / 609;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .avatar-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    .char-preview-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .char-preview-top,
    .char-preview-dots {
      position: relative;
      z-index: 1;
    }
    .char-preview-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .char-preview-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
    }
    .char-preview-tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      background: #851F25;
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .char-preview-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 12px;
    }
    .char-preview[onclick] {
      cursor: pointer;
    }
    .char-preview-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--border);
      cursor: pointer;
      transition: background .2s;
    }
    .char-preview-dot.active { background: var(--text-2); }

    .landing-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 20px;
    }
    .landing-badge::before, .landing-badge::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--gold-lt);
    }

    .landing-logo {
      font-size: clamp(36px, 10vw, 48px);
      font-weight: 700;
      color: var(--text-2);
      letter-spacing: -.02em;
      line-height: 1;
      margin-bottom: 10px;
    }
    .landing-logo span {
      font-weight: 700;
      color: var(--primary);
    }

    .landing-sub {
      font-size: 14px;
      color: var(--text-2);
      line-height: 20px;
      margin-bottom: 28px;
    }

    .landing-dims {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 28px;
    }
    .dim-pill {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 12px;
      color: var(--text-2);
      line-height: 1.4;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .dim-pill strong {
      display: block;
      color: var(--primary);
      font-size: 14px;
      margin-bottom: 2px;
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      background: var(--primary);
      color: #fff;
      font-family: var(--font-body);
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all .2s;
      letter-spacing: .02em;
    }
    .btn-primary:hover { background: #6A1F1F; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(123,40,40,.25); }
    .btn-primary:active { transform: translateY(0); }

    .landing-meta {
      text-align: center;
      font-size: 14px;
      color: var(--text-2);
      margin-top: 16px;
      opacity: .75;
    }

    /* ─── Quiz Screen ─── */
    .quiz-header {
      padding: 20px 0 16px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .progress-count {
      font-size: 12px;
      color: var(--text-2);
      letter-spacing: .05em;
    }
    .progress-dim {
      font-size: 11px;
      color: var(--gold);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .progress-track {
      height: 4px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--gold));
      border-radius: 4px;
      transition: width .4s ease;
    }

    .question-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
    }

    .question-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 28px 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      animation: slideIn .3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .q-num {
      font-size: 11px;
      color: var(--gold);
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .q-text {
      font-size: clamp(15px, 4vw, 17px);
      line-height: 1.65;
      color: var(--text);
    }

    .answers-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ans-btn {
      width: 100%;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      text-align: left;
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.6;
      color: var(--text);
      cursor: pointer;
      transition: all .2s;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(44,24,8,.04);
    }
    .ans-btn:hover {
      border-color: var(--primary);
      background: #FFF8F5;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(123,40,40,.10);
    }
    .ans-btn:active { transform: translateY(0); }
    .ans-btn.chosen {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .ans-label {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--gold-lt);
      color: var(--gold);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
      transition: all .2s;
    }
    .ans-btn.chosen .ans-label {
      background: rgba(255,255,255,.2);
      color: #fff;
    }

    .quiz-back {
      background: none;
      border: none;
      color: var(--text-2);
      font-family: var(--font-body);
      font-size: 13px;
      cursor: pointer;
      padding: 8px 0;
      opacity: .7;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .quiz-back:hover { opacity: 1; }

    /* ─── Result Screen ─── */
    .result-wrap {
      padding-top: 24px;
      animation: fadeUp .5s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .result-avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
      color: #fff;
      margin: 0 auto 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,.15);
    }
    .result-avatar-wrap {
      width: 100%;
      border-radius: var(--radius);
      margin: 0 auto 16px;
      overflow: hidden;
      aspect-ratio: 1065 / 609;
    }
    .result-avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .result-type-code {
      font-size: 14px;
      letter-spacing: .2em;
      color: var(--text-2);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .result-char-name {
      font-size: clamp(36px, 8vw, 34px);
      font-weight: 700;
      color: var(--text-2);
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .result-char-en {
      font-size: 14px;
      font-weight: 400;
      color: var(--text-2);
      font-style: italic;
    }

    .result-title {
      display: inline-block;
      margin-top: 10px;
      padding: 11px 32px;
      border-radius: 35px;
      /* background: var(--gold-lt); */
      background: rgb(243 229 228);
      color: var(--gold);
      font-size: 25px;
      font-weight: 700;
    }

    .result-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .result-verse {
      font-style: italic;
      font-size: 14px;
      line-height: 1.75;
      color: var(--text-2);
      border-left: 3px solid var(--gold);
      padding-left: 14px;
      margin-bottom: 6px;
      cursor: pointer;
    }

    .result-verse-ref {
      font-size: 12px;
      color: var(--gold);
      padding-left: 17px;
      letter-spacing: .04em;
      cursor: pointer;
    }
    .verse-ref-text {
      text-decoration: underline dotted;
      text-underline-offset: 3px;
    }

    .result-desc {
      font-size: 14px;
      line-height: 1.8;
      color: var(--text);
      margin-top: 18px;
    }

    .result-section-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
      margin-top: 20px;
    }

    .story-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .story-section { margin-bottom: 16px; }
    .story-section:last-child { margin-bottom: 0; }
    .story-section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 6px;
    }
    .story-section-body {
      font-size: 14px;
      line-height: 1.8;
      color: var(--text);
      white-space: pre-line;
    }

    .strengths-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .strength-tag {
      padding: 5px 12px;
      border-radius: 17px;
      color: var(--gold);
      font-size: 12px;
      font-weight: 400;
      background: rgba(140,26,26,0.06);
      border: 1px solid rgba(133,31,37,0.17);
    }

    .growth-text {
      font-size: 14px;
      line-height: 1.75;
      color: var(--text-2);
    }

    .advice-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .advice-sub { margin-bottom: 18px; margin-top: 16px; }
    .advice-sub:first-of-type { margin-top: 0; }
    .advice-sub:last-child { margin-bottom: 0; }
    .advice-sub-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }
    .advice-list {
      margin: 0;
      padding-left: 20px;
    }
    .advice-list li {
      font-size: 14px;
      line-height: 1.75;
      color: var(--text-2);
      margin-bottom: 4px;
    }
    .advice-list li:last-child { margin-bottom: 0; }
    .advice-headline {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .advice-line {
      font-size: 14px;
      line-height: 1.75;
      color: var(--text-2);
      margin: 0 0 6px 0;
    }
    .advice-line:last-child { margin-bottom: 0; }
    .advice-verse {
      font-size: 14px;
      line-height: 1.75;
      color: var(--text);
      font-style: italic;
      cursor: pointer;
    }
    .advice-verse-ref {
      font-size: 12px;
      color: var(--gold);
      margin-top: 4px;
      cursor: pointer;
    }
    .advice-verse-cta {
      font-size: 12px;
      margin-top: 8px;
    }

    /* ─── Dimension Analysis Pane ─── */
    .dim-analysis {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .dim-analysis-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 20px;
    }
    .dim-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .dim-row:last-child { margin-bottom: 0; }
    .dim-label-left,
    .dim-label-right {
      width: 56px;
      text-align: center;
      flex-shrink: 0;
    }
    .dim-label-left .dim-pct,
    .dim-label-right .dim-pct {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
    }
    .dim-label-left .dim-name,
    .dim-label-right .dim-name {
      font-size: 11px;
      color: var(--primary);
    }
    .dim-bar-track {
      flex: 1;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      position: relative;
      overflow: hidden;
    }
    .dim-bar-fill-left,
    .dim-bar-fill-right {
      position: absolute;
      top: 0;
      height: 100%;
      transition: width .5s ease;
    }
    .dim-bar-fill-left {
      right: 50%;
    }
    .dim-bar-fill-right {
      left: 50%;
    }
    .dim-row[data-dim="0"] .dim-bar-fill-left,
    .dim-row[data-dim="0"] .dim-bar-fill-right { background: #19C648; }
    .dim-row[data-dim="1"] .dim-bar-fill-left,
    .dim-row[data-dim="1"] .dim-bar-fill-right { background: #EBDB14; }
    .dim-row[data-dim="2"] .dim-bar-fill-left,
    .dim-row[data-dim="2"] .dim-bar-fill-right { background: #FF1931; }
    .dim-row[data-dim="3"] .dim-bar-fill-left,
    .dim-row[data-dim="3"] .dim-bar-fill-right { background: #663DEF; }


    /* ─── Locked Card Overlay ─── */
    .result-card-locked {
      position: relative;
    }
    .result-card-locked .result-card,
    .result-card-locked .advice-body {
      filter: blur(6px);
      -webkit-filter: blur(6px);
      pointer-events: none;
      user-select: none;
    }
    .result-card-locked .advice-card .dim-analysis-title {
      position: relative;
      z-index: 3;
    }
    .lock-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 2;
    }
    .lock-overlay img {
      width: 48px;
      opacity: .7;
    }
    .lock-overlay-cta {
      font-size: 14px;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
      text-decoration: none;
    }
    .lock-overlay-cta:hover {
      text-decoration: underline;
    }

    /* ─── Action Buttons ─── */
    .actions-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    .btn-share {
      width: 100%;
      padding: 14px;
      background: var(--gold-lt);
      color: var(--gold);
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      border: 1.5px solid var(--gold);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all .2s;
    }
    .btn-share:hover { background: var(--gold); color: #fff; }

    .btn-app {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: #fff;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all .2s;
      text-decoration: none;
      display: block;
      text-align: center;
    }
    .btn-app:hover { background: #6A1F1F; transform: translateY(-1px); }

    .btn-retry {
      width: 100%;
      padding: 13px;
      background: transparent;
      color: var(--text-2);
      font-family: var(--font-body);
      font-size: 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all .2s;
    }
    .btn-retry:hover { border-color: var(--text-2); color: var(--text); }


    .copied-toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #2A1A0E;
      color: #fff;
      font-size: 13px;
      padding: 10px 20px;
      border-radius: 20px;
      opacity: 0;
      transition: all .3s;
      pointer-events: none;
      z-index: 999;
      white-space: nowrap;
    }
    .copied-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ─── Divider ─── */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 8px 0;
    }

    /* ─── Responsive ─── */
    @media (max-width: 380px) {
      .landing-dims { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div id="app"></div>

// ═══════════════════════════════════════════════
// SCORING
// ═══════════════════════════════════════════════
function computeType(answers) {
  const c = { F:0, Q:0, A:0, C:0, P:0, I:0, G:0, J:0 };
  answers.forEach((ans, i) => {
    const q = QUESTIONS[i];
    c[ans === 'A' ? q.mapA : q.mapB]++;
  });
  state.scores = c;
  return (c.F >= c.Q ? 'F' : 'Q') +
         (c.A >= c.C ? 'A' : 'C') +
         (c.P >= c.I ? 'P' : 'I') +
         (c.G >= c.J ? 'G' : 'J');
}

function encodeAnswers(answers) {
  const bits = answers.map(a => a === 'A' ? '1' : '0').join('');
  return parseInt(bits, 2).toString(36);
}

function decodeAnswers(code, len) {
  const bits = parseInt(code, 36).toString(2).padStart(len, '0');
  return bits.split('').map(b => b === '1' ? 'A' : 'B');
}

function t(key) { return UI[state.lang][key]; }
function L(type, field) {
  const lang = state.lang === 'cn' ? 'cn' : state.lang === 'en' ? 'en' : 'tw';
  return type[`${field}_${lang}`];
}

function setLang(lang) {
  state.lang = lang;
  document.documentElement.lang = lang === 'tw' ? 'zh-Hant' : lang === 'cn' ? 'zh-Hans' : 'en';
  const url = new URL(window.location.href);
  url.searchParams.set('lang', lang);
  window.history.replaceState({}, '', url.toString());
  render();
}

function startQuiz() {
  trackEvent('start_quiz');
  state.screen = 'quiz';
  state.current = 0;
  state.answers = [];
  state.type = null;
  if (window.AndroidBridge) {
    window.AndroidBridge.saveData('bibleti', '');
  } else {
    localStorage.removeItem('bibleti');
  }
  render();
}

function answer(choice) {
  const btn = document.querySelector(`.ans-btn[data-choice="${choice}"]`);
  if (btn) { btn.classList.add('chosen'); }
  setTimeout(() => {
    state.answers.push(choice);
    if (state.current < QUESTIONS.length - 1) {
      state.current++;
      render();
    } else {
      state.type = computeType(state.answers);
      state.screen = 'result';
      const url = new URL(window.location.href);
      url.searchParams.set('a', encodeAnswers(state.answers));
      url.searchParams.set('lang', state.lang);
      window.history.replaceState({}, '', url.toString());
      render();
      const answerStr = state.answers.join(',')
      if (isInApp()) {
        if(window.AndroidBridge){
          window.AndroidBridge.saveData('bibleti', answerStr);
        } else {
          localStorage.setItem('bibleti', answerStr)
        }
      }
      trackEvent('finish_quiz', { result: state.type, answer: answerStr});
    }
  }, 220);
}

function goBack() {
  if (state.current === 0) {
    state.screen = 'landing';
    render();
  } else {
    state.current--;
    state.answers.pop();
    render();
  }
}

function shareResult() {
  const url = window.location.href;
  if (window.AndroidBridge) {
    AndroidBridge.shareToFriends(t('share_title'), t('share_text'), url);
  } else if (navigator.share) {
    navigator.share({ title: t('share_title'), text: t('share_text'), url });
  } else {
    navigator.clipboard.writeText(url).then(() => showToast(t('share_copied')));
  }
  trackEvent('share', { result: state.type });
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2800);
}

function retry() {
  state.screen = 'landing';
  state.current = 0;
  state.answers = [];
  state.type = null;
  state.shared = false;
  const url = new URL(window.location.href);
  url.searchParams.delete('a');
  url.searchParams.delete('lang');
  window.history.replaceState({}, '', url.toString());
  render();
  if (window.AndroidBridge) {
    window.AndroidBridge.saveData('bibleti', '');
  } else {
    localStorage.removeItem('bibleti');
  }
  trackEvent('retry');
}

const PREVIEW_KEYS = Object.keys(TYPES);
let previewIndex = 0;

// Pre-create all avatar img elements
const avatarImgs = {};
PREVIEW_KEYS.forEach(key => {
  const img = new Image();
  img.className = 'char-preview-bg';
  img.src = TYPES[key].avatar;
  img.alt = TYPES[key].char_en;
  img.style.display = 'none';
  avatarImgs[key] = img;
});

function mountAvatars(container) {
  if (!container) return;
  PREVIEW_KEYS.forEach(key => container.appendChild(avatarImgs[key]));
}

function showAvatar(key) {
  PREVIEW_KEYS.forEach(k => { avatarImgs[k].style.display = k === key ? '' : 'none'; });
}

function setPreviewIndex(i) {
  const total = PREVIEW_KEYS.length;
  previewIndex = ((i % total) + total) % total;
  updatePreviewCard();
}

function initSwipe() {
  const el = document.querySelector('.char-preview');
  if (!el) return;
  let startX = 0;
  let startY = 0;
  el.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });
  el.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
      setPreviewIndex(previewIndex + (dx < 0 ? 1 : -1));
    }
  }, { passive: true });
}

function viewCharacter(typeCode) {
  state.prevScreen = state.screen;
  state.detailType = typeCode;
  state.screen = 'detail';
  render();
  window.scrollTo(0, 0);
  trackEvent('explore_more');
}

function updatePreviewCard() {
  const key = PREVIEW_KEYS[previewIndex];
  const ch = TYPES[key];
  const lang = state.lang === 'en' ? 'en' : state.lang === 'cn' ? 'cn' : 'tw';
  const charName = ch['char_' + lang];
  const charTitle = ch['title_' + lang];

  const cardEl = document.querySelector('.char-preview');
  const nameEl = document.querySelector('.char-preview-name');
  const tagEl = document.querySelector('.char-preview-tag');
  if (cardEl) {
    showAvatar(key);
    if (cardEl.hasAttribute('onclick')) cardEl.setAttribute('onclick', `viewCharacter('${key}')`);
  }
  if (nameEl) nameEl.textContent = charName;
  if (tagEl) tagEl.textContent = charTitle;

  document.querySelectorAll('.char-preview-dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === previewIndex);
  });
}

function openBible(book, chapter) {
  const url = isInApp()
    ? `graceword://bible/${book}?chapter=${chapter}`
    : `https://grace-word.com/action/bible/${book}?chapter=${chapter}`;
  window.location.href = url;
}

function isInApp() {
  var ua = navigator.userAgent.toLowerCase();
  if(ua.match(/graceword/i)=="graceword") {

  }
  if (window.AndroidBridge) {

  return false;

      <div class="result-card">
        <div class="dim-analysis-title">${t('section_verse')}</div>
        <div class="result-verse" onclick="openBible(${type.verseBook}, ${type.verseChapter})">${verse}</div>
        <div class="result-verse-ref" onclick="openBible(${type.verseBook}, ${type.verseChapter})">— <span class="verse-ref-text">${verseRef}</span></div>
        <div class="result-desc">${desc}</div>

        <div class="result-section-title">${t('section_strengths')}</div>
        <div class="strengths-list">
          ${strengths.map(s => `<span class="strength-tag">${s}</span>`).join('')}
        </div>

        <div class="result-section-title">${t('section_growth')}</div>
        <p class="growth-text">${growth}</p>
      </div>
      ${renderDimAnalysis()}
      ${renderStoryCard(state.type)}
      ${isInApp() ? renderAdvice(state.type) : `
      <div class="result-card-locked">
        ${renderAdvice(state.type)}
        <div class="lock-overlay">
          <img src="https://assets.grace-word.com/app/bibleti/lock.webp" alt="locked">
          <a class="lock-overlay-cta" href="https://grace-word.com/action/web?url=https%3A%2F%2Fgrace-word.com%2Fbibleti">${t('unlock_advice')}</a>
        </div>
      </div>
      `}
      <div class="actions-wrap">
        ${state.shared ? `<button class="btn-share" onclick="retry()">${t('my_test')}</button>` : `<button class="btn-share" onclick="shareResult()">${t('share')}</button>`}
        ${isInApp() ? 
        `<button class="btn-app" onclick="viewCharacter(PREVIEW_KEYS[0] === state.type ? PREVIEW_KEYS[1] : PREVIEW_KEYS[0])">${t('app_cta')}</button>` : 
        `<button class="btn-app" onclick="location.href='https://grace-word.com/action/web?url=https%3A%2F%2Fgrace-word.com%2Fbibleti'">${t('read_advice')}</button>`}
      </div>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════
// RENDER: DETAIL
// ═══════════════════════════════════════════════
function setDetailIndex(i) {
  const total = PREVIEW_KEYS.length;
  const idx = ((i % total) + total) % total;
  state.detailType = PREVIEW_KEYS[idx];
  updateDetailCard();
}

function updateDetailCard() {
  const type = TYPES[state.detailType];
  if (!type) return;
  const lang = state.lang;
  const nameLang = lang === 'en' ? 'en' : lang === 'cn' ? 'cn' : 'tw';
  const charName = type[`char_${nameLang}`];
  const charEn = type.char_en;
  const titleStr = type[`title_${nameLang}`];
  const verse = type[`verse_${nameLang}`];
  const verseRef = type[`verse_ref_${nameLang}`];
  const desc = type[`desc_${nameLang}`];
  const strengths = type[`strengths_${nameLang}`];
  const growth = type[`growth_${nameLang}`];
  const isEn = lang === 'en';
  const currentIdx = getDetailKeyIndex();

  // Update avatar (show/hide — no network request)
  showAvatar(state.detailType);

  // Update dots
  document.querySelectorAll('.char-preview-dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === currentIdx);
  });

  // Update text content
  const codeEl = document.querySelector('.result-type-code');
  const nameEl = document.querySelector('.result-char-name');
  const enEl = document.querySelector('.result-char-en');
  const titleEl = document.querySelector('.result-title');
  if (codeEl) codeEl.textContent = state.detailType;
  if (nameEl) nameEl.textContent = charName;
  if (enEl) { if (!isEn) { enEl.textContent = charEn; enEl.style.display = ''; } else { enEl.style.display = 'none'; } }
  if (titleEl) titleEl.textContent = titleStr;

  // Update card content
  const verseEl = document.querySelector('.result-verse');
  const refEl = document.querySelector('.result-verse-ref');
  const descEl = document.querySelector('.result-desc');
  const growthEl = document.querySelector('.growth-text');
  if (verseEl) {
    verseEl.textContent = verse;
    verseEl.setAttribute('onclick', `openBible(${type.verseBook}, ${type.verseChapter})`);
  }
  if (refEl) {
    const refTextEl = refEl.querySelector('.verse-ref-text');
    if (refTextEl) refTextEl.textContent = verseRef;
    else refEl.textContent = '— ' + verseRef;
    refEl.setAttribute('onclick', `openBible(${type.verseBook}, ${type.verseChapter})`);
  }
  if (descEl) descEl.textContent = desc;
  if (growthEl) growthEl.textContent = growth;

  const strengthsEl = document.querySelector('.strengths-list');
  if (strengthsEl) strengthsEl.innerHTML = strengths.map(s => `<span class="strength-tag">${s}</span>`).join('');

  const adviceEl = document.querySelector('.advice-card');
  if (adviceEl) adviceEl.outerHTML = renderAdvice(state.detailType);

  const storyEl = document.querySelector('.story-card');
  if (storyEl) storyEl.outerHTML = renderStoryCard(state.detailType);

  window.scrollTo(0, 0);
}

function getDetailKeyIndex() {
  return PREVIEW_KEYS.indexOf(state.detailType);
}

function initDetailSwipe() {
  const el = document.querySelector('.detail-carousel');
  if (!el) return;
  let startX = 0, startY = 0;
  el.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });
  el.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
      setDetailIndex(getDetailKeyIndex() + (dx < 0 ? 1 : -1));
    }
  }, { passive: true });
}

function renderDetail() {
  const type = TYPES[state.detailType];
  if (!type) { state.screen = state.prevScreen || 'landing'; render(); return ''; }

  const lang = state.lang;
  const nameLang = lang === 'en' ? 'en' : lang === 'cn' ? 'cn' : 'tw';
  const charName = type[`char_${nameLang}`];
  const charEn   = type.char_en;
  const titleStr = type[`title_${nameLang}`];
  const verse    = type[`verse_${nameLang}`];
  const verseRef = type[`verse_ref_${nameLang}`];
  const desc     = type[`desc_${nameLang}`];
  const strengths= type[`strengths_${nameLang}`];
  const growth   = type[`growth_${nameLang}`];
  const isEn = lang === 'en';
  const currentIdx = getDetailKeyIndex();

  const dotsHtml = PREVIEW_KEYS.map((_, i) =>
    `<span class="char-preview-dot${i === currentIdx ? ' active' : ''}" onclick="setDetailIndex(${i})"></span>`
  ).join('');

  return `<div class="screen">
    <div class="lang-bar" style="justify-content:space-between">
      <button class="lang-btn" onclick="goBackFromDetail()" style="padding:4px 11px"><img src="https://assets.grace-word.com/app/bibleti/back.webp" alt="back" style="width:8px;vertical-align:middle"></button>
      <div style="display:flex;gap:6px">
        <button class="lang-btn ${state.lang==='tw'?'active':''}" onclick="setLang('tw')">繁中</button>
        <button class="lang-btn ${state.lang==='cn'?'active':''}" onclick="setLang('cn')">简中</button>
        <button class="lang-btn ${state.lang==='en'?'active':''}" onclick="setLang('en')">EN</button>
      </div>
    </div>
    <div class="result-wrap">
      <div class="detail-carousel">
        <div class="char-preview">
          <div class="avatar-container"></div>
          <div style="flex:1"></div>
          <div class="char-preview-dots">${dotsHtml}</div>
        </div>
      </div>

      <div class="result-header" style="margin-top:8px">
        <div class="result-type-code">${state.detailType}</div>
        <div class="result-char-name">${charName}</div>
        ${!isEn ? `<div class="result-char-en">${charEn}</div>` : ''}
        <span class="result-title">${titleStr}</span>
      </div>

      ${isInApp() ? `
      <div class="result-card">
        <div class="dim-analysis-title">${t('section_verse')}</div>
        <div class="result-verse" onclick="openBible(${type.verseBook}, ${type.verseChapter})">${verse}</div>
        <div class="result-verse-ref" onclick="openBible(${type.verseBook}, ${type.verseChapter})">— <span class="verse-ref-text">${verseRef}</span></div>
        <div class="result-desc">${desc}</div>

        <div class="result-section-title">${t('section_strengths')}</div>
        <div class="strengths-list">
          ${strengths.map(s => `<span class="strength-tag">${s}</span>`).join('')}
        </div>

        <div class="result-section-title">${t('section_growth')}</div>
        <p class="growth-text">${growth}</p>
      </div>
      ${renderStoryCard(state.detailType)}
      ${renderAdvice(state.detailType)}
      ` : `
      <div class="result-card-locked">
        <div class="result-card">
          <div class="result-section-title">${t('section_verse')}</div>
          <div class="result-verse" onclick="openBible(${type.verseBook}, ${type.verseChapter})">${verse}</div>
          <div class="result-verse-ref" onclick="openBible(${type.verseBook}, ${type.verseChapter})">— <span class="verse-ref-text">${verseRef}</span></div>
          <div class="result-desc">${desc}</div>

          <div class="result-section-title">${t('section_strengths')}</div>
          <div class="strengths-list">
            ${strengths.map(s => `<span class="strength-tag">${s}</span>`).join('')}
          </div>

          <div class="result-section-title">${t('section_growth')}</div>
          <p class="growth-text">${growth}</p>
        </div>
        <div class="lock-overlay">
          <img src="https://assets.grace-word.com/app/bibleti/lock.webp" alt="locked">
          <a class="lock-overlay-cta" href="https://grace-word.com/action/web?url=https%3A%2F%2Fgrace-word.com%2Fbibleti">${t('unlock')}</a>
        </div>
      </div>
      `}

    </div>
  </div>`;
}

function goBackFromDetail() {
  state.screen = state.prevScreen || 'landing';
  render();
}

// ═══════════════════════════════════════════════
// MAIN RENDER
// ═══════════════════════════════════════════════
function render() {
  const app = document.getElementById('app');
  if (state.screen === 'landing') {
    app.innerHTML = renderLanding(); initSwipe();
    mountAvatars(document.querySelector('.avatar-container'));
    showAvatar(PREVIEW_KEYS[previewIndex]);
  }
  else if (state.screen === 'quiz') app.innerHTML = renderQuiz();
  else if (state.screen === 'result') app.innerHTML = renderResult();
  else if (state.screen === 'detail') {
    app.innerHTML = renderDetail(); initDetailSwipe();
    mountAvatars(document.querySelector('.avatar-container'));
    showAvatar(state.detailType);
  }
}

// ═══════════════════════════════════════════════
// INIT — check URL params for direct result links
// ═══════════════════════════════════════════════
(function init() {
  const params = new URLSearchParams(window.location.search);
  const ansParam = params.get('a');
  const langParam = params.get('lang');
  const typeParam = params.get('type');

  if (langParam && ['tw','cn','en'].includes(langParam)) {
    state.lang = langParam;
    document.documentElement.lang = langParam === 'tw' ? 'zh-Hant' : langParam === 'cn' ? 'zh-Hans' : 'en';
  }

  if (ansParam) {
    const answers = decodeAnswers(ansParam, QUESTIONS.length);
    const type = computeType(answers);
    if (type && TYPES[type]) {
      state.type = type;
      state.screen = 'result';
      state.shared = true;
    }
  } else if (typeParam) {
    state.detailType = typeParam;
    state.screen = 'detail';
  } else {
    let savedData = ''
    if (window.AndroidBridge) {
      savedData = window.AndroidBridge.getData('bibleti');
    } else {
      savedData = localStorage.getItem('bibleti')
    }
    if (savedData) {
      const typeSaved = computeType(savedData.split(","))
      if (typeSaved && TYPES[typeSaved]) {
        state.type = typeSaved;
        state.screen = 'result';
      }
    }
  }
  render();
  trackEvent('page_open');
})();
</script>
</body>
</html>
