# GraceWord — 测试子域 origin 配置（behind Cloudflare）
# ============================================================================
# test.grace-word.com 仅供预览，永不索引。
# TLS 在 Cloudflare 终结，源站只跑 80。
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name test.grace-word.com;

    # 关键：测试环境一律不索引、不追踪
    add_header X-Robots-Tag "noindex, nofollow" always;

    # 测试环境 robots.txt 直接禁止抓取（双保险）
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # 下载动作（与生产一致，方便预览时点按钮）
    location /action/ {
        return 301 https://smart.link/95pq7a6upwpxf;
    }

    # 博客
    location /blog/ {
        alias /var/www/html/graceword/blog/;
        index index.html;
        try_files $uri $uri/ $uri.html =404;
    }

    # 主页
    location / {
        root /var/www/html/graceword;
        index index.html;
        if ($request_uri ~ ^/(.*)\.html(\?|$)) {
            return 302 /$1;
        }
        try_files $uri $uri.html $uri/ =404;
    }

    server_tokens off;
}
