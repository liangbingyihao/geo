# GraceWord — origin nginx config (behind Cloudflare)
# ============================================================================
# TLS terminates at Cloudflare. Public HTTPS traffic is decrypted at the edge
# and forwarded to this origin over plain HTTP(80). Therefore:
#
#   1. www -> non-www 301 is configured at Cloudflare (Rules -> Redirect Rules),
#      NOT here. The public https://www.grace-word.com traffic never reaches
#      this origin before being redirected.
#   2. HTTP -> HTTPS is also handled at Cloudflare ("Always Use HTTPS").
#
# This file = the production origin server block + the /blog/ static blog location.
# Deploy the blog with:  rsync -avz dist/blog/ <server>:/var/www/html/graceword/blog/
# Deploy robots.txt with: rsync -avz deploy/robots.txt <server>:/var/www/html/graceword/robots.txt
# (test.grace-word.com 由独立的 graceword_test.conf 负责，见该文件)
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name grace-word.com www.grace-word.com;

    location /.well-known/apple-app-site-association {
        root /var/www/html;
        default_type application/json;
    }

    # robots.txt：允许搜索/AI 引用，禁止 AI 训练（内容见 deploy/robots.txt）
    location = /robots.txt {
        root /var/www/html/graceword;
        add_header Content-Type "text/plain; charset=utf-8";
    }

    location /action/ {
        # return 301 https://$host/download;
        return 301 https://smart.link/95pq7a6upwpxf;
    }

    # Blog (GEO articles) — directory-style URLs:
    #   /blog/                    -> /var/www/html/graceword/blog/index.html
    #   /blog/{slug}/             -> .../blog/{slug}/index.html
    #   /blog/{slug}/zh-cn/       -> .../blog/{slug}/zh-cn/index.html
    #   /blog/{slug}/zh-tw/       -> .../blog/{slug}/zh-tw/index.html
    #   /blog/sitemap.xml         -> served directly
    location /blog/ {
        alias /var/www/html/graceword/blog/;
        index index.html;
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache";
    }

    # Podcast — directory-style URLs:
    #   /podcast/                     -> /var/www/html/graceword/podcast/index.html
    #   /podcast/zh-cn/               -> .../podcast/zh-cn/index.html
    #   /podcast/{series}/{ep}/       -> .../podcast/{series}/{ep}/index.html
    #   /podcast/{series}/feed.xml    -> served directly
    #   /podcast/sitemap.xml          -> served directly
    location /podcast/ {
        alias /var/www/html/graceword/podcast/;
        index index.html;
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        root /var/www/html/graceword;
        index index.html;
        if ($request_uri ~ ^/(.*)\.html(\?|$)) {
            return 302 /$1;
        }
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    server_tokens off;
}
