# SleepBuddy — origin nginx config（behind Cloudflare）
# ============================================================================
# TLS 在 Cloudflare 终结，源站只跑 80。
# www -> 非 www 301 与 HTTP -> HTTPS 均由 Cloudflare 处理（Rules -> Redirect Rules / Always Use HTTPS）。
#
# 本文件 = 生产 origin server block + /blog/ 静态博客 location。
# 部署：
#   主页族：   rsync -avz sleep-buddy/site/dist/ <server>:/var/www/html/sleepbuddy/      （不加 --delete）
#   博客：     rsync -avz --delete sleep-buddy/blog/dist/blog/ <server>:/var/www/html/sleepbuddy/blog/
#   activity： scp sleep-buddy/homepage/activity/sleep-holy-temple.html sleep-daily-encourage.html \
#                  <server>:/var/www/html/sleepbuddy/activity/
#   robots：   scp sleep-buddy/homepage/robots.txt <server>:/var/www/html/sleepbuddy/robots.txt
# (test.sleep-buddy.com 由独立的 sleepbuddy_test.conf 负责，见该文件)
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name sleep-buddy.com www.sleep-buddy.com;

    # robots.txt：允许搜索/AI 引用 + 训练，封杀 leech（内容见 sleep-buddy/homepage/robots.txt）
    location = /robots.txt {
        root /var/www/html/sleepbuddy;
        add_header Content-Type "text/plain; charset=utf-8";
    }

    # 邀请 / 下载落地页
    location ^~ /invite/install {
        try_files "" /invite_install.html;
    }
    location ^~ /download {
        try_files "" /invite_install.html;
    }
    location ^~ /invite/record {
        try_files "" /invite_record.html;
    }

    # Blog (GEO articles) — directory-style URLs:
    #   /blog/                    -> /var/www/html/sleepbuddy/blog/index.html
    #   /blog/{slug}/             -> .../blog/{slug}/index.html
    #   /blog/{slug}/zh-cn/       -> .../blog/{slug}/zh-cn/index.html
    #   /blog/{slug}/zh-tw/       -> .../blog/{slug}/zh-tw/index.html
    #   /blog/sitemap.xml         -> served directly
    location /blog/ {
        alias /var/www/html/sleepbuddy/blog/;
        index index.html;
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        root /var/www/html/sleepbuddy;
        index index.html;
        if ($request_uri ~ ^/(.*)\.html(\?|$)) {
            return 302 /$1;
        }
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    server_tokens off;
}
