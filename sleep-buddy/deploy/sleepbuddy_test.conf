# SleepBuddy — 测试子域 origin 配置（behind Cloudflare）
# ============================================================================
# test.sleep-buddy.com 仅供预览，永不索引。
# TLS 在 Cloudflare 终结，源站只跑 80。
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name test.sleep-buddy.com;

    # 关键：测试环境一律不索引、不追踪
    add_header X-Robots-Tag "noindex, nofollow" always;

    # 测试环境 robots.txt 直接禁止抓取（双保险）
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # 邀请 / 下载落地页（与生产一致，方便预览时点按钮）
    location ^~ /invite/install {
        try_files "" /invite_install.html;
    }
    location ^~ /download {
        try_files "" /invite_install.html;
    }
    location ^~ /invite/record {
        try_files "" /invite_record.html;
    }

    # 博客
    location /blog/ {
        alias /var/www/html/sleepbuddy/blog/;
        index index.html;
        try_files $uri $uri/ $uri.html =404;
    }

    # 主页族（/ /zh-cn/ /zh-tw/ /features/ + activity 页由 .html 重写处理）
    location / {
        root /var/www/html/sleepbuddy;
        index index.html;
        if ($request_uri ~ ^/(.*)\.html(\?|$)) {
            return 302 /$1;
        }
        try_files $uri $uri.html $uri/ =404;
    }

    server_tokens off;
}
