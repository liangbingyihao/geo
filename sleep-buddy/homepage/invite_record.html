<meta property="og:type" content="website">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: #f8f9ff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  .card {
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    padding: 32px 24px;
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  h1 {
    font-family: SF Arabic, SF Arabic;
    font-weight: bold;
    font-size: 24px;

    line-height: 33px;
    text-align: center;
    font-style: normal;
    text-transform: none;
    margin-bottom: 8px;
  }
  p.desc {
    font-family: SF Arabic, SF Arabic;
    font-weight: 400;
    font-size: 14px;

  .expired-redirect { color: #999; font-size: 13px; margin-top: 16px; }
  .expired-jump-btn {

    font-size: 14px;
    font-weight: 600;

  }
  .loading { color: #999; font-size: 15px; padding: 40px 0; }
  .form-group { margin-bottom: 24px; text-align: left; position: relative; }
  label {
    display: block;
    font-family: SF Arabic, SF Arabic;
    font-weight: 400;
    font-size: 14px;
    color: #333333;
    line-height: 20px;
    text-align: left;
    font-style: normal;
    text-transform: none;
    margin-bottom: 12px;
  }
  input[type=text], textarea {
    width: 100%;
    padding: 20px;
    padding-bottom: 32px;
    border: none;
    background-color: #f8f9ff;
    border-radius: 16px;
    font-size: 18px;
    outline: none;
    transition: all 0.2s;
    color: #666;
  }
  input[type=text]::placeholder,
  textarea::placeholder {
    font-family: SF Arabic, SF Arabic;
    font-weight: 400;
    font-size: 14px;
    color: #7B7B7B;
    line-height: 20px;
    text-align: left;
    font-style: normal;
    text-transform: none;
  }
  input[type=text]:focus, textarea:focus {
    box-shadow: 0 0 0 2px #6c7bff;
  }
  input[type=text].exceed, textarea.exceed {
    box-shadow: 0 0 0 2px #e53935;
  }
  textarea { resize: none; height: 200px; overflow-y: auto; }
  #recorderSection, #textSection { height: 200px; }
  .type-selector { display: flex; gap: 16px; margin: 24px 0; }
  .type-btn {
    flex: 1;
    padding: 20px;
    border-radius: 16px;
    border: none;
    background: #f8f9ff;
    cursor: pointer;
    font-family: SF Arabic, SF Arabic;
    font-weight: 400;
    font-size: 14px;
    color: #333333;
    line-height: 20px;
    text-align: left;
    font-style: normal;
    text-transform: none;
    transition: all 0.2s;
    /* 图标+文字居中 */
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  /* 隐藏图片标签 */
  .type-btn[data-type="image"] {
    display: none;
  }
  .type-btn:hover { opacity: 0.9; }
  .type-btn.active {
    border: 2px solid #6c7bff;
    font-family: SF Arabic, SF Arabic;
    font-weight: 400;
    font-size: 14px;
    color: #6574FB;
    line-height: 20px;
    text-align: left;
    font-style: normal;
    text-transform: none;
  }
  .file-input { display: none; }
  .file-label {
    display: block;
    padding: 20px;
    border: 2px dashed #ddd;
    border-radius: 16px;
    cursor: pointer;
    color: #999;
    font-size: 18px;
    transition: all 0.2s;
    background: #f8f9ff;
  }
  .file-label:hover { border-color: #6c7bff; color: #6c7bff; }
  .file-label.has-file {
    border-color: #6c7bff;
    background: #eef1ff;
    color: #6c7bff;
  }
  .submit-btn {
    display: block;
    width: 291px;
    height: 39px;
    max-width: 100%;
    margin: 8px auto 0;
    border: none;
    border-radius: 30px;
    background: linear-gradient(136deg, #5F75FA 0%, #B972FF 100%);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .submit-btn:hover { opacity: 0.92; }
  .submit-btn:disabled { background: #ccc; cursor: not-allowed; opacity: 1; }
  .char-counter {
    position: absolute;
    right: 10px;
    bottom: 10px;
    font-size: 12px;
    color: #999;
    background: rgba(248,249,255,0.85);
    padding: 2px 6px;
    border-radius: 4px;
    pointer-events: none;
  }
  .char-counter.exceed { color: #e53935; }
  .msg { margin-bottom: 16px; padding: 12px; border-radius: 16px; font-size: 14px; display: none; }
  .msg.success { display: block; background: #e6f7e6; color: #2e7d32; }
  .msg.error { display: block; background: #fdecea; color: #c62828; }

  .recorder-box {
    border: 2px dashed #ddd;
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    margin-bottom: 8px;
    background: #f8f9ff;
    height: 200px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .recorder-box.recording { border-color: #e53935; background: #fff5f5; }
  .recorder-box.has-recording { border-color: #6c7bff; background: #eef1ff; }
  .rec-timer {
    font-size: 28px;
    font-weight: 700;
    color: #333;
    margin: 8px 0;
    font-variant-numeric: tabular-nums;
  }
  .rec-timer.recording { color: #e53935; }
  .rec-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 24px; border: none; border-radius: 24px;
    font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s;
  }
  .rec-btn-start { background: linear-gradient(136deg, #5F75FA 0%, #B972FF 100%); border-radius: 30px; color: #fff; }
  .rec-btn-start:hover { opacity: 0.85; }
  .rec-btn-stop { background: #8C8C8C; color: #fff; }
  .rec-btn-stop:hover { background: #707070; }
  .rec-btn:disabled { background: #ccc; cursor: not-allowed; }
  .rec-preview { margin-top: 12px; }
  .rec-preview audio { width: 100%; height: 40px; border-radius: 8px; }
  .rec-hint { font-size: 13px; color: #999; margin-top: 8px; }
  .rec-hint.error { color: #c62828; }
  .notice {
    background: transparent;
    border-radius: 16px;
    padding: 14px 16px;
    margin: 16px 0 24px;
    text-align: left;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .notice-icon { font-size: 18px; line-height: 1.4; flex-shrink: 0; color: #6c7bff; }
  .notice-text {
    font-family: SF Arabic, SF Arabic;
    font-weight: 400;
    font-size: 12px;
    color: #7B7B7B;
    line-height: 17px;
    text-align: left;
    font-style: normal;
    text-transform: none;}
  .notice-text strong {
    font-family: SF Arabic, SF Arabic;
    font-weight: 600;
    font-size: 12px;
    color: #333333;
    line-height: 17px;
    text-align: left;
    font-style: normal;
    text-transform: none;
  }
  .notice-privacy {
    font-family: SF Arabic, SF Arabic;
    font-weight: 400;
    font-size: 12px;
    color: #6574FB;
    line-height: 17px;
    text-align: left;
    font-style: normal;
    text-transform: none;
  }
  .gift-bar {
    text-align: center;
    margin-left: -25px;
    margin-right: -25px;
    margin-top: 8px;
  }
  .gift-box {
    position: relative;
    width: 100%;
    height: 126px;
    max-width: none;
    margin: 0 auto;
    cursor: pointer;
    overflow: hidden;
    border-radius: 12px;
  }
  .gift-box img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .gift-box-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: SF Arabic, SF Arabic;
    font-weight: 600;
    font-size: 16px;
    color: #6574FA;
    line-height: 22px;
    text-align: center;
    font-style: normal;
    text-transform: none;
    white-space: nowrap;
    padding-left: 2.8em;
    pointer-events: none;
  }
  .gift-box:hover { opacity: 0.85; }
  .modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .modal-card {
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    padding: 28px 24px;
    width: min(320px, 90vw);
    text-align: center;
  }
  .modal-title {
    font-family: SF Arabic, SF Arabic;
    font-weight: bold;
    font-size: 18px;
    color: #333333;
    line-height: 26px;
    text-align: center;
    margin-bottom: 20px;
  }
  .modal-step {
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
    margin-bottom: 12px;
  }
  .step-num {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: linear-gradient(136deg, #5F75FA 0%, #B972FF 100%);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .step-text {
    font-family: SF Arabic, SF Arabic;
    font-weight: 400;
    font-size: 14px;
    color: #333333;
    line-height: 20px;
    text-align: left;
  }
  .modal-download {
    display: block;
    width: 100%;
    padding: 12px 16px;
    border-radius: 24px;
    background: linear-gradient(136deg, #5F75FA 0%, #B972FF 100%);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    text-align: center;
    margin-bottom: 20px;
    transition: opacity 0.2s;
  }
  .modal-download:hover { opacity: 0.9; }
  .modal-code {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: #f8f9ff;
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 20px;
  }
  .code-value {
    font-size: 22px;
    font-weight: 700;
    color: #6574FB;
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
  }
  .code-copy {
    border: none;
    border-radius: 16px;
    background: linear-gradient(136deg, #5F75FA 0%, #B972FF 100%);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    cursor: pointer;
    transition: opacity 0.2s;
    white-space: nowrap;
  }
  .code-copy:hover { opacity: 0.9; }
  .modal-close {
    display: block;
    width: 100%;
    padding: 12px 16px;
    border: 1px solid #e4e7f5;
    border-radius: 30px;
    background: #fff;
    color: #7a7f9a;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  .modal-close:hover {
    border-color: #c9cee6;
    color: #5f6480;
  }
  .heading-area { width: 100%; max-width: 480px; text-align: center; }
  /* 名字高亮色统一设计稿主色 */
  #creatorName {
    color: #6574FB !important;
  }
</style>
</head>
<body>
<div class="heading-area">
  <h1>给 <span id="creatorName">好友</span> 的睡前鼓励~</h1>
  <p class="desc" data-i18n="pageDesc">你的好友正在努力早睡，送上一份鼓励吧！</p>
</div>
<div class="card" id="app">
  <div id="loading">
    <div class="loading" data-i18n="loading">检查链接状态...</div>
  </div>
  <div id="expired" style="display:none;">
    <div class="expired-icon">&#x23F0;</div>
    <h1 data-i18n="expiredHeading">链接已过期</h1>
    <p class="expired-text" data-i18n="expiredText">该素材收集链接已失效，请联系你的好友重新生成。</p>
    <p class="expired-redirect" id="expiredRedirect" style="display:none;"></p>
    <button class="expired-jump-btn" id="expiredJumpBtn" style="display:none;" data-i18n="jumpNow">跳转官网</button>
  </div>
  <div id="formArea" style="display:none;">

    <form id="uploadForm" enctype="multipart/form-data">
      <div class="form-group">
        <label data-i18n="labelName">你的昵称</label>
        <div style="position: relative;">
          <input type="text" id="friendName" data-i18n="placeholderName" placeholder="请输入你的名字" required maxlength="60">
          <span class="char-counter" id="nameCounter">0/20</span>
        </div>
      </div>

      <div class="type-selector">
        <!-- 图片标签 保留结构仅隐藏 -->
        <button type="button" class="type-btn" data-type="image" data-i18n="tabImage">图片</button>
        <!-- 录音 增加麦克风图标 -->
        <button type="button" class="type-btn active" data-type="audio">
          <img id="tabAudioIcon" src="https://graceword.oss-cn-hongkong.aliyuncs.com/sleep/static/record_active.png" style="height:12px;"> <span data-i18n="tabAudio">录音</span>
        </button>
        <!-- 文字 增加文字图标 -->
        <button type="button" class="type-btn" data-type="text">
          <img id="tabTextIcon" src="https://graceword.oss-cn-hongkong.aliyuncs.com/sleep/static/text.png" style="height:12px;"> <span data-i18n="tabText">文字</span>
        </button>
      </div>

      <div id="fileSection">
        <label class="file-label" id="fileLabel" for="fileInput">
          <span id="fileText" data-i18n="filePickImage">点击选择图片</span>
        </label>
        <input type="file" class="file-input" id="fileInput" accept="image/*">
      </div>

      <div class="form-group">
        <label data-i18n="labelText">鼓励的话</label>
        <div id="recorderSection">
          <div class="recorder-box" id="recorderBox">
            <div class="rec-timer" id="recTimer">00:00</div>
            <div>
              <button type="button" class="rec-btn rec-btn-start" id="recStartBtn"><img src="https://graceword.oss-cn-hongkong.aliyuncs.com/sleep/static/icon-mic.webp" style="height:12px;"><span data-i18n="startRecord">开始录音</span></button>
              <button type="button" class="rec-btn rec-btn-stop" id="recStopBtn" style="display:none;">&#x23F9;<span data-i18n="stopRecord">停止</span></button>
            </div>
<div class="rec-preview" id="recPreview" style="display:none;"></div>
          <div class="rec-hint" id="recHint">点击"开始录音"录制你的鼓励</div>
          </div>
        </div>
        <div id="textSection" style="display:none;">
          <textarea id="textContent" data-i18n="placeholderText" placeholder="写一段话鼓励你的好友吧..." maxlength="100"></textarea>
          <span class="char-counter" id="textCounter">0/100</span>
        </div>
      </div>

      <div class="msg" id="msg"></div>

      <button type="submit" class="submit-btn" id="submitBtn" data-i18n="submitBtn">发送鼓励</button>

      <div class="gift-bar">
        <div class="gift-box" id="giftBtn">
          <img src="https://graceword.oss-cn-hongkong.aliyuncs.com/sleep/static/gift%402x.png" alt="">
          <span class="gift-box-text" data-i18n="giftText">好友送你，7天免费使用礼包</span>
        </div>
      </div>

      <div class="notice" id="noticeBlock">
        <div class="notice-icon"><img src="https://graceword.oss-cn-hongkong.aliyuncs.com/sleep/static/info%402x.png" style="height:12px;"></div>
        <div class="notice-text">
          <strong data-i18n="noticeTitle">内容用途说明</strong><br>
          <div id="noticeBodyBlock">
          <span data-i18n="noticeBody">你提交的内容将显示在好友的手机锁屏上，每次解锁都能看到你的鼓励。</span><br>
          <span class="notice-privacy" data-i18n="noticePrivacy">仅你和对方可见，其他任何人无法查看。</span>
          </div>
        </div>
      </div>
    </form>

  </div>
</div>

<div class="modal-mask" id="giftModal">
  <div class="modal-card">
    <div class="modal-title" data-i18n="modalTitle">7天免费使用礼包</div>

    <div class="modal-step">
      <div class="step-num">1</div>
      <div class="step-text" data-i18n="modalStep1">复制邀请码</div>
    </div>
    <div class="modal-code">
      <span class="code-value" id="inviteCodeText">------</span>
      <button class="code-copy" id="copyCodeBtn" data-i18n="copyBtn">复制</button>
    </div>

    <div class="modal-step">
      <div class="step-num">2</div>
      <div class="step-text" data-i18n="modalStep2">下载 App，在支付页面粘贴邀请码</div>
    </div>
    <a class="modal-download" href="https://apps.apple.com/app/id6773677490" target="_blank" data-i18n="modalDownload">点击 iOS 应用商店下载 App</a>

    <button class="modal-close" id="closeModalBtn" data-i18n="gotIt">我知道了</button>
  </div>
</div>

  var _setHeading = function(name) {

  var params = new URLSearchParams(window.location.search);
  var API_BASE = params.get('api_base') || window.location.origin;
  var sessionId = params.get('session_id');
  if (window.AppJSBridge === true) {
    var giftBar = document.querySelector('.gift-bar');
    if (giftBar) giftBar.style.display = 'none';
  }
  var loading = document.getElementById('loading');
  var expired = document.getElementById('expired');
  var formArea = document.getElementById('formArea');
  var inviteCode = "";

  var REDIRECT_URL = "https://sleep-buddy.com";
  var REDIRECT_SECONDS = 5;
  var redirectTimer = null;

  function startRedirectCountdown() {
    var el = document.getElementById('expiredRedirect');
    var jumpBtn = document.getElementById('expiredJumpBtn');
    el.style.display = 'block';
    jumpBtn.style.display = 'inline-block';
    var left = REDIRECT_SECONDS;
    function tick() {
      if (left <= 0) {
        window.location.href = REDIRECT_URL;
        return;

      left--;
      redirectTimer = setTimeout(tick, 1000);
    }
    tick();
  }

  document.getElementById('expiredJumpBtn').addEventListener('click', function() {
    window.location.href = REDIRECT_URL;
  });

  if (!sessionId) {
    loading.style.display = 'none';
    expired.style.display = 'block';
    expired.querySelector('.expired-text').textContent = _t('expiredNoSession');
    startRedirectCountdown();
    return;
  }

  var xhr = new XMLHttpRequest();
  xhr.open('GET', API_BASE + '/api/sleep/assets/friend/session/' + sessionId);
  xhr.onload = function() {
    loading.style.display = 'none';
    var resp = JSON.parse(xhr.responseText);
    if (resp.code === 'OK' && resp.data && !resp.data.expired) {
      formArea.style.display = 'block';
      if (resp.data.creator_name) {
        _setHeading(resp.data.creator_name);
        if (window.AppJSBridge === true) {
          document.getElementById('friendName').value = resp.data.creator_name;
          updateCounter(document.getElementById('friendName'), document.getElementById('nameCounter'), 20);
        }
      }
      inviteCode = resp.data.invite_code || "";
      document.getElementById('inviteCodeText').textContent = inviteCode || "------";
      document.querySelector('.type-btn[data-type="audio"]').click();
    } else {
      expired.style.display = 'block';
      startRedirectCountdown();
    }
  };
  xhr.onerror = function() {
    loading.style.display = 'none';
    expired.style.display = 'block';
    expired.querySelector('.expired-text').textContent = _t('expiredNetwork');
  };
  xhr.send();

  var form = document.getElementById('uploadForm');
  var typeBtns = document.querySelectorAll('.type-btn');
  var fileSection = document.getElementById('fileSection');
  var recorderSection = document.getElementById('recorderSection');
  var textSection = document.getElementById('textSection');
  var fileInput = document.getElementById('fileInput');
  var fileLabel = document.getElementById('fileLabel');
  var fileText = document.getElementById('fileText');
  var msg = document.getElementById('msg');
  var submitBtn = document.getElementById('submitBtn');

  var recStartBtn = document.getElementById('recStartBtn');
  var recStopBtn = document.getElementById('recStopBtn');
  var tabAudioIcon = document.getElementById('tabAudioIcon');
  var tabTextIcon = document.getElementById('tabTextIcon');
  var ICON_AUDIO = 'https://graceword.oss-cn-hongkong.aliyuncs.com/sleep/static/record.png';
  var ICON_AUDIO_ACTIVE = 'https://graceword.oss-cn-hongkong.aliyuncs.com/sleep/static/record_active.png';
  var ICON_TEXT = 'https://graceword.oss-cn-hongkong.aliyuncs.com/sleep/static/text.png';
  var ICON_TEXT_ACTIVE = 'https://graceword.oss-cn-hongkong.aliyuncs.com/sleep/static/text_active.png';
  var recTimer = document.getElementById('recTimer');
  var recPreview = document.getElementById('recPreview');
  var recHint = document.getElementById('recHint');
  var recorderBox = document.getElementById('recorderBox');

  var isApple = /iPhone|iPad|iPod|Mac OS|Safari/.test(navigator.userAgent) && !/Chrome|Android/.test(navigator.userAgent);
  var MAX_RECORD_SECONDS = 60;
  applyI18n();
  recHint.textContent = _t('hintDefault');
  var mediaRecorder = null;
  var audioChunks = [];
  var recordedBlob = null;
  var timerInterval = null;
  var seconds = 0;

  function getCurrentType() {
    return document.querySelector('.type-btn.active').dataset.type;
  }

  function stopTimer() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  }

  function _displayWidth(s) {
    var w = 0;
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      w += (c >= 0x4e00 && c <= 0x9fff) ? 2 : 1;
    }
    return w;
  }

  function updateCounter(input, counterEl, maxW) {
    var w = _displayWidth(input.value);
    var exceed = w > maxW;
    counterEl.textContent = w + '/' + maxW;
    counterEl.className = exceed ? 'char-counter exceed' : 'char-counter';
    input.className = exceed ? (input.className.replace(/\bexceed\b/g, '').trim() + ' exceed') : input.className.replace(/\bexceed\b/g, '').trim();
  }

  var noticeTitle = document.querySelector('.notice-text strong');
  if (noticeTitle) {
    noticeTitle.addEventListener('click', function() {
      var b = document.getElementById('noticeBodyBlock');
      var arrow = document.querySelector('.notice-arrow');
      b.style.display = b.style.display === 'none' ? 'block' : 'none';
      if (arrow) arrow.textContent = b.style.display === 'none' ? '\u25BC' : '\u25B2';
    });
  }

  var friendNameInput = document.getElementById('friendName');
  var textContentEl = document.getElementById('textContent');
  friendNameInput.addEventListener('input', function() {
    updateCounter(friendNameInput, document.getElementById('nameCounter'), 20);
  });
  textContentEl.addEventListener('input', function() {
    updateCounter(textContentEl, document.getElementById('textCounter'), 100);
  });

  function formatTime(s) {
    var m = String(Math.floor(s / 60)).padStart(2, '0');
    var sec = String(s % 60).padStart(2, '0');
    return m + ':' + sec;
  }

  function resetRecorderUI() {
    recordedBlob = null;
    audioChunks = [];
    recPreview.style.display = 'none';
    recPreview.innerHTML = '';
    recHint.textContent = _t('hintDefault');
    recHint.className = 'rec-hint';
    recTimer.textContent = '00:00';
    recTimer.className = 'rec-timer';
    recorderBox.className = 'recorder-box';
  }

  typeBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      typeBtns.forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      tabAudioIcon.src = ICON_AUDIO;
      tabTextIcon.src = ICON_TEXT;
      if (btn.dataset.type === 'audio') tabAudioIcon.src = ICON_AUDIO_ACTIVE;
      else if (btn.dataset.type === 'text') tabTextIcon.src = ICON_TEXT_ACTIVE;
      var t = btn.dataset.type;
      if (t === 'text') {
        fileSection.style.display = 'none';
        recorderSection.style.display = 'none';
        textSection.style.display = 'block';
      } else if (t === 'audio') {
        fileSection.style.display = 'none';
        textSection.style.display = 'none';
        recorderSection.style.display = 'block';
      } else {
        fileSection.style.display = 'block';
        recorderSection.style.display = 'none';
        textSection.style.display = 'none';
        fileInput.accept = 'image/*';
        fileText.textContent = _t('filePickImage');
        fileLabel.classList.remove('has-file');
      }
    });
  });

  fileInput.addEventListener('change', function() {
    if (fileInput.files.length > 0) {
      fileLabel.classList.add('has-file');
      fileText.textContent = fileInput.files[0].name;
    } else {
      fileLabel.classList.remove('has-file');
      fileText.textContent = getCurrentType() === 'image' ? _t('filePickImage') : _t('filePickAudio');
    }
  });

  recStartBtn.addEventListener('click', function() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      recHint.textContent = _t('hintNoSupport');
      recHint.className = 'rec-hint error';
      return;
    }
    recHint.textContent = _t('hintGetPermission');
    recHint.className = 'rec-hint';
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
      audioChunks = [];
      seconds = 0;
      recTimer.textContent = '00:00';
      recTimer.className = 'rec-timer recording';
      recorderBox.className = 'recorder-box recording';
      recStartBtn.style.display = 'none';
      recStopBtn.style.display = 'inline-flex';
      recPreview.style.display = 'none';
      recPreview.innerHTML = '';
      recHint.textContent = _t('hintRecording');
      recHint.className = 'rec-hint';

      stopTimer();
      timerInterval = setInterval(function() {
        seconds++;
        recTimer.textContent = formatTime(seconds);
        if (seconds >= MAX_RECORD_SECONDS) {
          if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
          }
          stopTimer();
        }
      }, 1000);

      if (!MediaRecorder.isTypeSupported('audio/mp4')) {
        recHint.textContent = _t('hintNoM4a');
        recHint.className = 'rec-hint error';
        recStartBtn.style.display = 'inline-flex';
        recStartBtn.querySelector('span').textContent = _t('startRecord');
        recStopBtn.style.display = 'none';
        return;
      }
      var mimeType = 'audio/mp4';

      mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType: mimeType }) : new MediaRecorder(stream);
      mediaRecorder.ondataavailable = function(e) {
        if (e.data.size > 0) audioChunks.push(e.data);
      };
      mediaRecorder.onstop = function() {
        stopTimer();
        stream.getTracks().forEach(function(t) { t.stop(); });
        recordedBlob = new Blob(audioChunks, { type: mimeType.split(';')[0] });
        recTimer.className = 'rec-timer';
        recorderBox.className = 'recorder-box has-recording';
        recStartBtn.style.display = 'inline-flex';
        recStartBtn.querySelector('span').textContent = _t('reRecord');
        recStopBtn.style.display = 'none';
        recHint.textContent = _t('hintDone', {time: formatTime(seconds)});
        recHint.className = 'rec-hint';
        recPreview.style.display = 'block';
        var audio = document.createElement('audio');
        audio.controls = true;
        audio.src = URL.createObjectURL(recordedBlob);
        recPreview.appendChild(audio);
      };
      mediaRecorder.start();
    }).catch(function(err) {
      recHint.textContent = _t('hintPermissionDenied', {msg: err.message});
      recHint.className = 'rec-hint error';
    });
  });

  recStopBtn.addEventListener('click', function() {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
    }
  });

  form.addEventListener('submit', function(e) {
    e.preventDefault();

    var giftBarEl = document.querySelector('.gift-bar');
    if (giftBarEl && giftBarEl.style.display !== 'none') {
      document.getElementById('giftBtn').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    msg.className = 'msg';
    msg.style.display = 'none';
    submitBtn.disabled = true;

    try {
      var friendName = document.getElementById('friendName').value.trim();
      if (_displayWidth(friendName) > 20) {
        showError(_t('errorNameTooLong'));
        submitBtn.disabled = false;
        return;
      }

      var textContent = document.getElementById('textContent').value.trim();
      if (textContent && _displayWidth(textContent) > 100) {
        showError(_t('errorTextTooLong'));
        submitBtn.disabled = false;
        return;
      }

      var hasAudio = !!recordedBlob;
      var hasText = !!textContent;

      if (!hasAudio && !hasText) {
        showError(_t('errorTextEmpty'));
        submitBtn.disabled = false;
        return;
      }

      var tasks = [];
      if (hasAudio) {
        var ext = recordedBlob.type.includes('mp4') ? 'm4a' : 'webm';
        var audioFile = new File([recordedBlob], 'recording.' + ext, { type: recordedBlob.type });
        var fd = new FormData();
        fd.append('friend_name', friendName);
        fd.append('type', 'audio');
        fd.append('file', audioFile);
        tasks.push(fd);
      }
      if (hasText) {
        var fd = new FormData();
        fd.append('friend_name', friendName);
        fd.append('type', 'text');
        fd.append('content', textContent);
        tasks.push(fd);
      }

      var done = 0;
      var failed = false;
      var successCount = 0;
      function sendNext() {
        if (done >= tasks.length) {
          if (!failed) {
            msg.className = 'msg success';
            msg.textContent = _t('successMsg');
            msg.style.display = 'block';
            var savedName = document.getElementById('friendName').value;
            form.reset();
            document.getElementById('friendName').value = savedName;
            fileLabel.classList.remove('has-file');
            fileText.textContent = _t('filePickImage');
            resetRecorderUI();
          }
          submitBtn.disabled = false;
          return;
        }
        var xhr = new XMLHttpRequest();
        xhr.open('POST', API_BASE + '/api/sleep/assets/friend/upload/' + sessionId);
        xhr.setRequestHeader('X-Language', _locale === 'zh' ? 'zh-CN' : 'en');
        xhr.onload = function() {
          if (xhr.status !== 200) {
            failed = true;
            try {
              var resp = JSON.parse(xhr.responseText);
              showError(resp.msg || _t('errorUpload'));
            } catch(e) {
              showError(_t('errorServer', {status: xhr.status ? ' (' + xhr.status + ')' : ''}));
            }
          } else {
            successCount++;
            if (tasks.length > 1) {
              msg.className = 'msg success';
              msg.textContent = _t('successCount', {n: successCount});
              msg.style.display = 'block';
            }
          }
          done++;
          sendNext();
        };
        xhr.onerror = function() {
          failed = true;
          showError(_t('errorNetwork'));
          done++;
          sendNext();
        };
        xhr.send(tasks[done]);
      }
      sendNext();
    } catch(e) {
      showError(_t('errorSubmit', {msg: e.message}));
      submitBtn.disabled = false;
    }
  });

  function showError(text) {
    msg.className = 'msg error';
    msg.textContent = text;
    msg.style.display = 'block';
  }

  function hideMsg() {
    msg.style.display = 'none';
  }

  friendNameInput.addEventListener('input', hideMsg);
  textContentEl.addEventListener('input', hideMsg);
  document.getElementById('recStartBtn').addEventListener('click', hideMsg);

  // gift-box 弹窗逻辑
  var giftBtn = document.getElementById('giftBtn');
  var giftModal = document.getElementById('giftModal');
  var copyCodeBtn = document.getElementById('copyCodeBtn');
  var closeModalBtn = document.getElementById('closeModalBtn');

  giftBtn.addEventListener('click', function() {
    if (inviteCode) {
      giftModal.style.display = 'flex';
    } else {
      window.location.href = 'https://apps.apple.com/app/id6773677490';
    }
  });

  var modalDownload = document.querySelector('.modal-download');
  modalDownload.addEventListener('click', function(e) {
    e.preventDefault();
    var url = modalDownload.href;
    var w = window.open(url, '_blank');
    if (!w) window.location.href = url;
  });

  function closeModal() {
    giftModal.style.display = 'none';
  }

  closeModalBtn.addEventListener('click', closeModal);
  giftModal.addEventListener('click', function(e) {
    if (e.target === giftModal) closeModal();
  });

  copyCodeBtn.addEventListener('click', function() {
    if (!inviteCode) return;
    var done = function() {
      copyCodeBtn.textContent = _t('copied');
      setTimeout(function() {
        copyCodeBtn.textContent = _t('copyBtn');
      }, 2000);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(inviteCode).then(done, function() {
        fallbackCopy(inviteCode, done);
      });
    } else {
      fallbackCopy(inviteCode, done);
    }
  });

  function fallbackCopy(text, done) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      if (done) done();
    } catch (e) {
      if (done) done();
    }
    document.body.removeChild(ta);
  }
})();
